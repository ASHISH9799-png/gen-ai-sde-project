name: CI-CD Pipeline Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Code Quality Check (Ruff)
        run: |
          pip install ruff
          ruff check backend/

      - name: Install Backend Dependencies & Run Bruno API Tests
        env:
          GEMINI_API_KEY: "AIzaSy_MOCK_KEY_FOR_CI_CD_PIPELINE_VALIDATION"
        run: |
          pip install -r backend/requirements.txt
          pytest backend/tests/
