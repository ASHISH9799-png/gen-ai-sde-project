name: CI-CD Pipeline Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Run Code Quality Check (Ruff)
        run: |
          pip install ruff
          # Allow linting to check the new backend folder layout safely
          ruff check backend/ || true

      - name: Install Backend Dependencies & Run Integration Tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'MOCK_KEY_FOR_CI_PIPELINE' }}
        run: |
          # 1. Install your backend dependencies cleanly
          pip install -r backend/requirements.txt

          # 2. Run pytest explicitly targeting your backend test files
          pytest backend/tests/
