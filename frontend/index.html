<!DOCTYPE html>

    <title>NitiMitra AI: Compliance Auditor</title>
    <!--Connect our stylesheet file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

        <!--Dashboard Header -->
        <header class="app-header">
            <h1> NitiMitra AI</h1>
            <p>Real-Timeb RBI and Indian Bank Rules Compliance Auditor Agent</p>

        <!--Chat History Workspace Dispaly -->

        <!-- Interactive Input Footer Control -->
        <footer class="input-area">
            <input type="text" id="userInput" placeholder="Type an auditor inquiry..." autocomplete="off">
            <button id="sendBtn">Send</button>
        </footer>
    </div>

    <!-- Connect our JavaScript controller engine file -->
     <script src="app.js"></script>
